name: Update Pro Matchups
on:
  workflow_dispatch:
  schedule:
    - cron: '35 5 * * *'
permissions:
  contents: write
concurrency:
  group: midlab-pro-cache
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect competitive and configured SoloQ records
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python scripts/update_pro.py
      - name: Commit updated cache
        run: |
          git config user.name 'midlab-data[bot]'
          git config user.email 'midlab-data@users.noreply.github.com'
          git add pro-matches.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update pro matchup cache'
            git push
          fi
